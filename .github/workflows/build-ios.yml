name: Build iOS IPA

on:
  workflow_dispatch:  # Se activa manualmente

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache KMP / Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar framework iOS (KMP)
        run: ./gradlew :composeApp:assembleXCFramework

      - name: Instalar CocoaPods
        run: |
          cd iosApp
          pod install --repo-update

      - name: Build y exportar IPA (sin firma, para sideload)
        run: |
          cd iosApp
          xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Goodtime.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Goodtime.xcarchive \
            -exportPath $RUNNER_TEMP/Goodtime \
            -exportOptionsPlist exportOptions.plist

      - name: Crear exportOptions.plist
        run: |
          cat > $RUNNER_TEMP/exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Goodtime-iOS
          path: $RUNNER_TEMP/Goodtime/*.ipa
          retention-days: 7
