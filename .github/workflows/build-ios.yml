name: Build iOS IPA

on:
  workflow_dispatch:        # Se ejecuta manualmente desde la pestaña Actions

jobs:
  build-ios:
    runs-on: macos-latest   # Necesario: el proyecto exige el SDK de iOS 26 (Xcode 26)
    timeout-minutes: 120     # La 1.ª compilación de Kotlin/Native para iOS tarda bastante

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # El proyecto usa objectVersion 77, IPHONEOS_DEPLOYMENT_TARGET 26.0 y un app icon
      # "Liquid Glass" (.icon) -> requiere Xcode 26. Seleccionamos el más reciente estable.
      - name: Seleccionar Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # composeApp aplica el plugin com.android.application (compileSdk 36).
      # Aunque solo queramos el framework iOS, Gradle CONFIGURA el target Android,
      # y eso falla si la plataforma android-36 no está instalada. La instalamos.
      - name: Instalar Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager -> $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      # Diagnóstico: si algo falla, en el log queda claro qué Xcode/SDK/scheme hay.
      - name: Diagnóstico (Xcode, SDKs, schemes)
        run: |
          echo "===== Xcode ====="; xcodebuild -version
          echo "===== SDKs iOS ====="; xcodebuild -showsdks | grep -i ios || true
          echo "===== Schemes ====="; xcodebuild -project iosApp/iosApp.xcodeproj -list || true

      # Compila el archive SIN firma. xcodebuild dispara la fase "Compile Kotlin
      # Framework" del propio proyecto, que corre :composeApp:embedAndSignAppleFrameworkForXcode.
      # Anulamos el equipo/firma del maintainer para que no intente provisioning.
      - name: Build archive (sin firma, para sideload)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Goodtime.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=""

      # Un .ipa es solo un zip con la carpeta Payload/<App>.app dentro.
      # El widget (GoodtimeInProgressExtension.appex) ya va embebido en PlugIns/.
      - name: Empaquetar IPA desde el archive
        run: |
          set -e
          APP_PATH="$(find "$RUNNER_TEMP/Goodtime.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró el .app en el archive"; exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qry Goodtime.ipa Payload )
          echo "----- IPA -----"
          ls -lh "$RUNNER_TEMP/Goodtime.ipa"

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Goodtime-iOS
          path: ${{ runner.temp }}/Goodtime.ipa
          retention-days: 14
