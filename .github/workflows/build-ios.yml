name: Build iOS IPA

# Silencia el aviso de Node.js 20 y fuerza Node 24 (variable confirmada por GitHub).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:        # Se ejecuta manualmente desde la pestaña Actions

jobs:
  build-ios:
    runs-on: macos-latest   # Runner M1 con Xcode 26 (obligatorio para este proyecto)
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # objectVersion 77 + deployment target 26.0 + app icon "Liquid Glass" => Xcode 26.
      - name: Seleccionar Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # composeApp también es app de Android (compileSdk 36); Gradle configura ese target
      # aunque solo queramos iOS, y falla si la plataforma android-36 no está instalada.
      - name: Instalar Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager -> $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      # El runner M1 solo tiene 7 GB de RAM. Repartimos la memoria entre el daemon de
      # Gradle y el de Kotlin/Native para que coexistan. Estas claves (en GRADLE_USER_HOME)
      # tienen prioridad sobre las del repo, así no hay que tocar gradle.properties del proyecto.
      - name: Ajustar memoria de Gradle / Kotlin/Native
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          kotlin.native.jvmArgs=-Xmx5g
          EOF
          echo "----- ~/.gradle/gradle.properties -----"
          cat ~/.gradle/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Diagnóstico (Xcode, SDKs, schemes)
        run: |
          echo "===== Xcode ====="; xcodebuild -version
          echo "===== SDKs iOS ====="; xcodebuild -showsdks | grep -i ios || true
          echo "===== Schemes ====="; xcodebuild -project iosApp/iosApp.xcodeproj -list || true

      # CLAVE: -configuration Debug. El Release intenta una optimización LTO
      # (devirtualización) que necesita >6 GB y revienta la memoria del runner.
      # Debug se la salta -> compila bien. xcodebuild dispara la fase "Compile Kotlin
      # Framework", que ahora corre linkDebugFrameworkIosArm64 en vez de Release.
      - name: Build archive (Debug, sin firma, para sideload)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Goodtime.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=""

      # Un .ipa es solo un zip con Payload/<App>.app dentro. El widget ya va embebido.
      - name: Empaquetar IPA desde el archive
        run: |
          set -e
          APP_PATH="$(find "$RUNNER_TEMP/Goodtime.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró el .app en el archive"; exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qry Goodtime.ipa Payload )
          echo "----- IPA -----"
          ls -lh "$RUNNER_TEMP/Goodtime.ipa"

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Goodtime-iOS
          path: ${{ runner.temp }}/Goodtime.ipa
          retention-days: 14
